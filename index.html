MG=["Anladım, devam et","Hmm ilginç, biraz daha anlat","Öyle mi, ben de öyle düşünüyorum","Güzel, ben de buradayım","Doğru söylüyorsun galiba","Tamam {n}, dinliyorum","Ha öyle, güzelmiş","Peki, sonra ne oldu?"];
function mnP(a,bn){let L=a.filter(x=>!MNRC.includes(typeof x=="function"?x.toString():x));if(!L.length)L=a;const v=pick(L);MNRC.push(typeof v=="function"?v.toString():v);if(MNRC.length>40)MNRC.shift();let r=typeof v=="function"?v():v;return r.replace(/\{n\}/g,S.name).replace(/\{b\}/g,bn||"Savaşçı")}
function mnR(x,bn){const t=x.replace(/@[\wçğıöşüÇĞİÖŞÜ.]+/g," ").replace(/\s+/g," ").trim(),M=/@[\wçğıöşüÇĞİÖŞÜ.]+/.test(x),p=" "+MNN(t)+" ",hit=[];
BK.forEach((e,i)=>{let sc=0;e[1].forEach(k=>{if(mnK(p,k))sc++});if(sc)hit.push([sc,i])});
hit.sort((a,b)=>b[0]-a[0]||a[1]-b[1]);let r;
if(hit.length){const f=BK[hit[0][1]],o=[mnP(f[2],bn)];if(!f[3]&&hit[1]&&MNS.includes(BK[hit[1][1]][0]))o.push(mnP(BK[hit[1][1]][2],bn));r=o.map(z=>/[.!?]$/.test(z)?z:z+".").join(" ").replace(/\.$/,"")}
else r=mnP(/\?|(^| )(mi|mu|ne|neden|niye|nasil|kim|kac|hangi)( |$)/.test(p+x)?MQ:MG,bn);
return(M?"@"+S.name+" ":"")+r}


const CLB=()=>SERVER_URL.replace(/^ws/,"http");
let cmS=null,cmI=null,cmBusy=0,cmErr=0;
const cmUid=()=>{if(!S.uid){S.uid=Array.from({length:16},()=>"abcdefghjkmnpqrstuvwxyz23456789"[Math.floor(Math.random()*31)]).join("");save()}return S.uid};
async function cmApi(code,act,body){try{const r=await fetch(CLB()+"/club/"+code+"/"+act,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(Object.assign({uid:cmUid(),name:S.name,ci:S.prof[0]??0},body||{}))});return await r.json()}catch(e){return{err:"net"}}}
const cmEr=e=>({net:"Sunucuya bağlanılamadı",nofound:"Klüp bulunamadı",full:"Klüp dolu (10/10)",banned:"Bu klüpten atıldın",exists:"Bu kod dolu, tekrar dene",name:"Klüp adı en az 3 harf olmalı",notmember:"Bu klüpte değilsin",owner:"Sadece klüp sahibi yapabilir"}[e]||"Hata: "+e);
function cmAdd(L){L.forEach(m=>{if(m.id<=cmS.last)return;cmS.feed.push(m.sys?{sys:1,x:m.x}:{n:m.n,ci:m.ci<C.length?m.ci:0,x:m.x,me:m.p==cmS.me?1:0});cmS.last=m.id})}
function cmEnter(code,r){S.mpc={code};cmS={code,n:r.n,o:r.o,me:r.me,mem:r.mem,now:r.now,feed:[],last:0,bots:[]};const ex=r.mem.map(m=>m.n);for(let k=0;k<3;k++){const b=nb(ex.concat(cmS.bots.map(x=>x.n)));cmS.bots.push(b)}cmS.feed.push({sys:1,x:"🌐 "+r.n+" klübüne hoş geldin! Aşağıdaki 🤖 botlarla da sohbet edebilirsin"});cmAdd(r.msgs);save();chs="mpc";render()}

const AB=[["⚔️","Savaş ve Kupa","Savaş modlarında kazanınca kupa kazanır, kaybedince kaybedersin. Her maç sonunda ayrıca altın alırsın, kazanınca daha çok. Kupa arttıkça liderlik tablosunda yükselirsin."],["📦","Sandık ve Karakterler","Dükkandan altın ya da elmasla sandık açarsın, sandıktan karakter çıkar. Güçlü sandıklarda yüksek enderlikli karakter çıkma şansı daha fazladır. Ters en yüksek enderliktir."],["⬆️","Seviye ve Cephane","Karakterini altınla geliştirirsin. En üst seviye 11, son basamak 25.000 altındır. Her vuruş 1 cephane harcar, 3 cephane vardır. Dükkan'dan seçtiğin tek karakter için en fazla +3 ekstra cephane alabilirsin."],["📜","Görevler ve Altın","Görev sekmesinde 12 görev var. Tamamlayınca Ödülü Al'a bas: 1.000-10.000 altın ve 5-100 elmas (11 görev); bir görev ise 1-10 💵 para verir. Ödülü alınan görev 2 dakika sonra yenilenir."],["👥","Takımlı Oyun","Oda Kodu sekmesinden 2-5 kişilik oda kur, kodu veya linki arkadaşına gönder. Odada karakterini seç, Savaş sekmesinden bir mod başlat. Eksik oyuncuları yapay zeka tamamlar."],["🏅","Liderlik ve Klüp","Liderlik tablosunda botlarla ve diğer oyuncularla yarışırsın. Sohbette ve klüpte @isim yazarsan o kişi cevap verir. Hesabını Destek bölümünden yedekleyebilirsin."]];
const CHT=[["🪙 +5000 altın","gold",5000],["🪙 +1000 altın","gold",1000],["🪙 +500 altın","gold",500],["💎 +10 elmas","dia",10],["💎 +100 elmas","dia",100],["💎 +500 elmas","dia",500],["💵 +5 para","gem",5]];
const VER=43,CHL=[[43,["🔒 Ayarlar → Özel Bölge: hesap bilgisi, hesabı sıfırla, yeni hesap oluştur, kayıtlı hesaplara giriş yap","🙂 Profil görünümü: beden ya da sadece karakterin kafası (yuvarlak profil)"]],[42,["⚖️ Denge güncellemesi: bütün karakterlerin hasarı yarıya indi, kupa kasmak daha uzun sürecek","🔨 Smash boss canı +100.000 (tek 205.000, takım 310.000, takımlı oda 520.000)","👹 İkiz Boss: 2 dakika, 18 sn'de 9 yaratık, yeniden doğma yok","🏆 Düello kupası -12, Hesaplaşma kupası biraz azaldı","💵 Dükkan: Kupa Kalkanı, Çift Altın Kartı, Premium Arka Planlar; Ultra Hiperşarj 200, Ultra Cephane 190"]],[41,["✍️ Profil: 3 yeni isim stili (Elmas, Glitch, Zıplayan)","🌈 Profil: 3 yeni ışıltılı arka plan (Prizma, Galaksi, Garip Dalga)"]],[40,["🏅 Liderlik botları: aktifken 10 saniyede 120 🏆 kasar, çoğu AFK 💤; sen oyunda değilken kupa kasmazlar"]],[39,["🌐 Multiplayer Klüpler: kodla katıl, gerçek oyuncularla yaz, 10 kişiye kadar, sahibi atabilir, botlar da sohbette"]],[38,["🏆 Kupa Yolu: kupa hedeflerine ulaştıkça sırayla altın, elmas ve 💵 ödülleri, 250.000 🏆'a kadar (Savaş ekranı)"]],[37,["📦 2 yeni sandık: Altın Kasa ve Mega Ters Sandığı","⚽ Savaş Topu açılışı: sayısız, logolu 2 saniyelik ekran","🎚 Takımlı oyunda Kolay / Normal / Zor seçimi","⭐ Takımlı odalara Ödül Avı modu","🎮 Mini oyun: odadaki arkadaşınla 1v1 Savaş ve Top, yeni arena"]],[36,["🔨 Smash artık takımlı odada: 420.000 canlı boss, yeniden doğan adamları, +900 🏆","👑 Büyük Hesaplaşma açılış hatası düzeltildi","📜 12 görevden biri artık 1-10 💵 veriyor","💵 Ters'ten önceki sandıktan %15 ihtimalle çıkıyor","👤 Profil: durum yazısı, istatistikler, rozetler","🏅 Liderlik: en iyi sıran","ℹ️ Savaş ekranında bilgi düğmesi ve yeni mod logoları","🆕 Yenilikler sayfası"]],[35,["🎭 Karakterler rütbeye göre baştan çizildi","🏟 Arena görünümleri, ses seviyesi, titreşim","🆘 Destek merkezi yenilendi","🏅 Liderlikte üst sıra hedefi"]],[34,["⚽ Gol ve 💀 tur ekranı, 3 turlu Nakavt","💥 Her karakterin farklı ultisi","✨ Neon kostümleri","👤 Profil arka planı, unvan, vitrin"]]];
function newsOpen(){S.seenV=VER;save();ov(`<div style="max-width:380px;margin:auto"><h3>🆕 Yenilikler</h3><div style="max-height:62vh;overflow:auto;text-align:left">${CHL.map(v=>`<div class=tg style="display:block"><b style="color:#ffd23c">Sürüm ${v[0]}</b>${v[1].map(x=>`<div style="margin:4px 0;font-size:13px">${x}</div>`).join("")}</div>`).join("")}</div><button class=b style="margin-top:8px" onclick="cl()">Kapat</button></div>`);render()}
const CHW=3e4;
const chL=i=>{const m=Math.ceil(Math.max(0,((S.chT||{})[i]||0)+CHW-Date.now())/1000);return Math.floor(m/60)+":"+String(m%60).padStart(2,"0")};
const chW=i=>!!(S.chT&&S.chT[i]&&Date.now()<S.chT[i]+CHW);
function cht(i){S.chT=S.chT||{};const c=CHT[i];if(chW(i))return toast("⏳ "+chL(i)+" sonra tekrar");S[c[1]]=(S[c[1]]||0)+c[2];S.chT[i]=Date.now();save();head();snd(800,.1);toast(c[0]);chUp()}
function chUp(){CHT.forEach((c,i)=>{const e=$("#chb"+i);if(!e)return;e.disabled=chW(i);e.innerHTML=chW(i)?"⏳ "+chL(i)+" · "+c[0]:c[0]})}
setInterval(()=>{if(SG=="cheat")chUp()},1000);
const ACK="arena_accs",RGK="arena_rg";
const acList=()=>{try{return JSON.parse(localStorage.getItem(ACK))||{}}catch(e){return{}}};
const acSave=o=>{try{localStorage.setItem(ACK,JSON.stringify(o));return true}catch(e){return false}};
const acRg=()=>{try{return JSON.parse(localStorage.getItem(RGK))||{}}catch(e){return{}}};
const acRgSave=o=>{try{localStorage.setItem(RGK,JSON.stringify(o))}catch(e){}};
const acNid=()=>"a"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
if(!S.aid){S.aid=acNid();save()}
{const gm=acRg();let ch=0;(S.rg||[]).concat(S.rk||[]).forEach(h=>{if(!gm[h]){gm[h]=S.aid;ch=1}});if(ch)acRgSave(gm)}
const acFresh=(n,aid,set)=>({gold:500,dia:0,tr:0,own:{0:0,1:0,2:0,3:0,4:0},name:n,frame:"#ffb020",prof:[0],set:set||{fx:1,snd:1,spd:1,num:1,th:0},ct:{},v31:1,aid,cr:Date.now()});
function acGo(data){window.__ns=1;try{localStorage.setItem("arena1",typeof data=="string"?data:JSON.stringify(data))}catch(e){window.__ns=0;return toast("Kaydedilemedi (depolama dolu olabilir)")}location.reload()}
function acCreate(){const n=(($("#acn")||{}).value||"").trim().slice(0,14);if(n.length<2)return toast("İsim en az 2 harf olmalı");const L=acList();if(Object.keys(L).length>=4)return toast("En fazla 5 hesap açabilirsin");L[S.aid]={n:S.name,t:Date.now(),d:JSON.stringify(S)};if(!acSave(L))return toast("Kaydedilemedi (depolama dolu olabilir)");acGo(acFresh(n,acNid(),JSON.parse(JSON.stringify(S.set))))}
function acLogin(id){const L=acList(),a=L[id];if(!a)return;L[S.aid]={n:S.name,t:Date.now(),d:JSON.stringify(S)};delete L[id];if(!acSave(L))return toast("Kaydedilemedi");acGo(a.d)}
function acDel(id){const L=acList();if(!L[id]||!confirm("\""+L[id].n+"\" hesabı kalıcı olarak silinsin mi?"))return;delete L[id];acSave(L);render()}
function acReset(){if(!confirm("Hesabındaki TÜM ilerleme (karakterler, altın, elmas, kupa) silinecek. Emin misin?"))return;if(!confirm("Bu işlem geri alınamaz! Gerçekten sıfırlansın mı?"))return;acGo(acFresh(S.name,S.aid,JSON.parse(JSON.stringify(S.set))))}
function vAcc(){const L=acList(),ids=Object.keys(L).sort((a,b)=>L[b].t-L[a].t);return `<button class=bk onclick="sgo(null)">← Geri</button><h3>🔒 Özel Bölge</h3><div class=sup-c><div class=sup-h><span>👤</span><div><b>Hesap bilgisi</b><small>Şu an giriş yapılan hesap</small></div></div><div class=pst><span>🏷 ${esc(S.name)}</span><span>🆔 ${esc(String(S.aid).slice(-6))}</span><span>🏆 ${S.tr.toLocaleString("tr-TR")}</span><span>🪙 ${S.gold.toLocaleString("tr-TR")}</span><span>💎 ${S.dia.toLocaleString("tr-TR")}</span><span>💵 ${S.gem||0}</span><span>🧑‍🤝‍🧑 ${Object.keys(S.own).length}/${C.length}</span><span>🏅 ${S.mw||0}/${S.mt||0} maç</span>${S.cr?`<span>📅 ${new Date(S.cr).toLocaleDateString("tr-TR")}</span>`:""}</div></div><button class=b style="width:100%;margin:6px 0;background:#c33;color:#fff" onclick="acReset()">♻ Hesabı sıfırla</button><button class=b style="width:100%;margin:6px 0" onclick="sgo('newacc')">➕ Yeni hesap oluştur</button>${ids.length?`<h3>📂 Kayıtlı hesaplar</h3>${ids.map(id=>{let d={};try{d=JSON.parse(L[id].d)}catch(e){}return `<div class=fr><span class=lv>${svg(C[(d.prof&&d.prof[0])||0]||C[0])}</span><b style="flex:1">${esc(L[id].n)}<br><small>🏆 ${(d.tr||0).toLocaleString("tr-TR")} · 🪙 ${(d.gold||0).toLocaleString("tr-TR")}</small></b><button class=b onclick="acLogin('${id}')">Giriş yap</button><button class=b style="background:#555" onclick="acDel('${id}')">🗑</button></div>`}).join("")}`:""}`}
function vNewAcc(){return `<button class=bk onclick="sgo('priv')">← Geri</button><h3>➕ Yeni hesap</h3><p style="font-size:12px;opacity:.8">Şu anki hesabın kayıtlı kalır; Özel Bölge'den istediğin zaman <b>Giriş yap</b> ile geri dönebilirsin. Yeni hesap sıfırdan başlar.</p><input id=acn placeholder="Oyuncu ismini gir" maxlength=14 autocomplete=off style="width:100%;padding:12px;border-radius:10px;border:0;font-size:16px"><button class=b style="width:100%;margin-top:10px" onclick="acCreate()">Tamam</button>`}
const privBtn=()=>`<div class=tg style="display:block"><button class=b style="width:100%" onclick="sgo('priv')">🔒 Özel Bölge</button></div>`;
const aboutBtn=()=>`<div class=tg style="display:block"><button class=b style="width:100%" onclick="sgo('about')">🎯 Oyun amaçları hakkında</button></div>`;
function vSG(){const bk=t=>`<button class=bk onclick="sgo(${t})">← Geri</button>`,m=/^t(\d)$/.exec(SG);
if(SG=="priv")return vAcc();if(SG=="newacc")return vNewAcc();
if(m){const a=AB[+m[1]];return bk("'about'")+`<h3>${a[0]} ${a[1]}</h3><p style="line-height:1.5">${a[2]}</p>`}
if(SG=="about")return bk("null")+`<h3>🎯 Oyun Amaçları</h3>`+AB.map((a,i)=>`<button class=b style="width:100%;margin:5px 0;text-align:left" onclick="sgo('t${i}')">${a[0]} ${a[1]}</button>`).join("")+`<div style="height:90vh"></div><div style="text-align:left"><button class=b style="width:33px;height:33px;padding:0;border-radius:50%;opacity:.3;font-size:15px" onclick="sgo('hid')">⚔️</button></div>`;
if(SG=="hid")return bk("'about'")+`<h3>🔐 Doğrulama kodu</h3><p style="font-size:12px;opacity:.8">Devam etmek için doğrulama kodunu gir.</p><input id=hk placeholder="Doğrulama kodu" maxlength=30 autocomplete=off style="width:100%;padding:10px;border-radius:8px;border:0;font-size:16px"><button class=b style="width:100%;margin-top:8px" onclick="hidGo(1)">Onayla</button>`;
if(SG=="hid2")return bk("'about'")+`<h3>🔑 Hile kodunu girin</h3><input id=hk placeholder="Hile kodu" maxlength=16 autocomplete=off style="width:100%;padding:10px;border-radius:8px;border:0;font-size:16px"><button class=b style="width:100%;margin-top:8px" onclick="hidGo(2)">Gir</button><button class=b style="width:100%;margin-top:14px;background:#1d6fd1" onclick="sgo('tips')">💡 Bedava hile için neler yapmalı?</button>`;
if(SG=="tips")return bk("'hid2'")+`<h3>💡 Bedava hile nasıl alınır?</h3><div class=tg style="display:block;line-height:1.55"><b>Emekle güçlenmenin yolları:</b><br>⚔️ Düello ve çok altın kazandıran maçları hızlıca oynamak<br>📜 Görevleri takip edip hepsini tamamlamak<br>🪙💎 Çok sayıda altın ve elmas biriktirmek (💵 para sadece görünüm için olduğundan çok kritik değil)<br>🔶 Ekstra cephane almak ve cephane dolumunu hızlandırmak<br>🧙 Karakterlerinin seviyesini yükseltip güçlendirmek<br>👤 Profilden havalı bir isim yapıp hızlıca kupa kasmak</div><div class=tg style="display:block;border:2px solid #ffd23c;line-height:1.55"><b style="color:#ffd23c">📌 Önemli not</b><br>Unutmayın: gücünüzü altın ve elmas belirliyor olabilir, ama seviyenizi her zaman <b>kupa</b> belirler. Altın ve elmas bir süre sonra, en güçlü karakterlere sahip olan zenginler için işe yaramaz hâle gelecek. O zaman para ne işe yarayacak? Hızlıca kupanı kasacaksın. Kimisi hile ister, kimisi emekle eder. Sana güveniyorum. 💪</div>`;
return bk("'about'")+`<h3>🧪 Hile</h3><p style="font-size:12px;opacity:.8">Her seçeneği bir kez kullanabilirsin. ⏳ 30 saniye sonra yeniden kullanılabilir.</p>`+CHT.map((c,i)=>`<button id=chb${i} class=b style="width:100%;margin:5px 0" ${chW(i)?"disabled":""} onclick="cht(${i})">${chW(i)?"⏳ "+chL(i)+" · "+c[0]:c[0]}</button>`).join("")}
render();
</script>
